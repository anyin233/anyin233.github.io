short_bio_text_justify: false
short_bio_en: >-
  <p>Yanwei Ye is a Ph.D. student in Computer Science at the University of Edinburgh. His research explores systems for agentic AI and scalable AI infrastructure, with a focus on low-latency scheduling for agentic workloads and compilation for wafer-scale accelerators. He is interested in making complex and heterogeneous computing platforms more efficient, predictable, and easier to program. His current work spans scheduling, runtime systems, performance modeling, and compiler support for emerging AI workloads. He previously completed an M.S. in Computer Science at the University of Science and Technology of China.</p>
short_bio_zh: >-
  <p>叶言威，爱丁堡大学计算机科学博士生。主要研究智能体 AI 系统与可扩展 AI 基础设施，关注智能体工作负载的低延迟调度、晶圆级加速器编译，以及面向新型 AI 应用的运行时与性能建模问题。目前的工作致力于让复杂异构计算平台更高效、更稳定，也更易于编程。此前，他在中国科学技术大学获得计算机科学硕士学位。</p>

