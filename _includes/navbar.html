<nav class="navbar navbar-expand-sm navbar-light fixed-top mb-5 shadow-sm">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <a class="navbar-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.data.profile.navbar_name_en }}" data-i18n-aria data-aria-en="{{ site.data.profile.navbar_name_en | escape }}" data-aria-zh="{{ site.data.profile.navbar_name_zh | escape }}">
            <strong data-site-name="en" data-lang="en">{{ site.data.profile.navbar_name_en }}</strong>
            <strong data-site-name="zh" data-lang="zh">{{ site.data.profile.navbar_name_zh }}</strong>
        </a>
        <button class="navbar-toggler" style="font-size: 1em; padding: 0.5em;" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation" data-i18n-aria data-aria-en="Toggle navigation" data-aria-zh="展开导航">
            <i class="fas fa-map"></i> <span data-lang="en">Menu</span><span data-lang="zh">菜单</span>
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                {% for item in site.data.navigation.pages %}
                <li class="nav-item {% if item.key == page.navbar_key or include.active_page == item.key %}active{% endif %}">
                    <a class="nav-link" href="{{ item.url | relative_url }}">
                        <span data-lang="en">{{ item.name_en }}</span>
                        <span data-lang="zh">{{ item.name_zh }}</span>
                    </a>
                </li>
                {% endfor %}
            </ul>
            <button id="language-toggle" class="btn btn-sm language-toggle ml-sm-3 mt-2 mt-sm-0" type="button" aria-pressed="false" aria-label="Switch to Chinese" data-i18n-aria data-aria-en="Switch to Chinese" data-aria-zh="切换到英文">
                <span data-lang="en">中文</span>
                <span data-lang="zh">English</span>
            </button>
        </div>
    </div>
</nav>
